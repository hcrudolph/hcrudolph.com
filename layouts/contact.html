{{- define "main" }}
<style>
body {
    background-color: #f5f5f5;
}

input {
    width: 100%;
    border: 1px solid #eee;
    padding: 12px;
    margin: 10px 0;
    box-sizing: border-box;
    border-radius: var(--radius);
    background-color: #fff;
}

textarea {
    width: 100%;
    min-height: 100px;
    border: 1px solid #eee;
    padding: 12px;
    margin: 10px 0;
    box-sizing: border-box;
    resize: vertical;
    border-radius: var(--radius);
    background-color: #fff;
}

.submit-container {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    text-align: center;
}

.flex-child {
    flex: 1;
}

button {
    min-width: 50%;
    border: 1px solid #333;
    padding: 12px;
    border-radius: var(--radius);
}

button:hover {
    color: #fff;
    background-color: #333;
}
</style>

<header class="page-header">
    <h1>{{ .Title }}</h1>
</header>

<form action="https://formspree.io/f/xlgvvqnj" method="POST">
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name" required />

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email address" required />

    <label for="message">Message</label>
    <textarea name="message" id="message" required /></textarea>
    <!-- Turnstile widget -->
    <div class="submit-container">
        <div class="cf-turnstile flex-child" data-sitekey="0x4AAAAAADZtdUIs6RZxiH76" data-callback="enableSubmit"></div>
        <button type="submit" class="flex-child">Send</button>
    </div>
</form>

<script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    <script>
      function enableSubmit() {
        document.getElementById("submit-button").disabled = false;
      }
</script>

{{- end }}{{/* end main */}}
